name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build universal macOS DMG
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Developer ID signing certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPER_ID_APPLICATION_P12_BASE64"
          test -n "$DEVELOPER_ID_APPLICATION_P12_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/snip-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$SIGNING_IDENTITY"
          echo "SNIP_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project Snip.xcodeproj \
            -scheme Snip \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/SnipDerivedData" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Sign and verify application
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SnipDerivedData/Build/Products/Release/Snip.app"
          test -d "$APP_PATH"

          /usr/bin/codesign \
            --force \
            --sign "$SNIP_SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "$APP_PATH"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          /usr/bin/codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q "Authority=Developer ID Application:" "$RUNNER_TEMP/codesign.txt"
          grep -q "Identifier=com.m3di.Snip" "$RUNNER_TEMP/codesign.txt"
          grep -q "TeamIdentifier=" "$RUNNER_TEMP/codesign.txt"

      - name: Verify application architectures
        run: |
          APP_PATH="$RUNNER_TEMP/SnipDerivedData/Build/Products/Release/Snip.app"
          test -d "$APP_PATH"
          lipo "$APP_PATH/Contents/MacOS/Snip" -archs | tee "$RUNNER_TEMP/architectures.txt"
          grep -q "arm64" "$RUNNER_TEMP/architectures.txt"
          grep -q "x86_64" "$RUNNER_TEMP/architectures.txt"
          plutil -p "$APP_PATH/Contents/Info.plist"

      - name: Create DMG
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/SnipDerivedData/Build/Products/Release/Snip.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          DMG_NAME="Snip-${VERSION}.dmg"
          STAGING_DIR="$RUNNER_TEMP/SnipDMG"

          rm -rf "$STAGING_DIR" dist
          mkdir -p "$STAGING_DIR" dist
          cp -R "$APP_PATH" "$STAGING_DIR/Snip.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          hdiutil create \
            -volname "Snip" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/$DMG_NAME"

          hdiutil verify "dist/$DMG_NAME"
          (cd dist && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          (cd dist && shasum -a 256 -c "$DMG_NAME.sha256")

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.sha256
