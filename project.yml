name: Snip
options:
  bundleIdPrefix: com.snip
  deploymentTarget:
    macOS: "13.0"
targets:
  Snip:
    type: application
    platform: macOS
    sources:
      - path: Snip
        excludes:
          - Resources/Info.plist
    resources:
      - Snip/Resources/Assets.xcassets
    info:
      path: Snip/Resources/Info.plist
    dependencies:
      - framework: AppKit.framework
        embed: false
      - framework: ScreenCaptureKit.framework
        embed: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.snip.app
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      SWIFT_VERSION: "5.0"
      INFOPLIST_FILE: Snip/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
